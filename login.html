<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — Cilok Pak Mayoni</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FFF1F2 0%, #FFFFFF 100%);
      padding: var(--space-4);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
    }
    .login-header {
      text-align: center;
      margin-bottom: var(--space-5);
    }
    .login-header .brand {
      font-family: 'Poppins', sans-serif;
      font-size: 24px;
      font-weight: 700;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
    }
    .form-group input {
      height: 44px;
      padding: 0 var(--space-3);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
    }
    .login-error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-3);
      color: var(--color-error);
      font-size: 14px;
      display: none;
    }
    .login-error.visible {
      display: block;
    }
    .login-footer {
      text-align: center;
      margin-top: var(--space-4);
    }
    .login-footer a {
      color: var(--color-text-muted);
      font-size: 14px;
      transition: color 150ms ease;
    }
    .login-footer a:hover {
      color: var(--color-primary);
    }
    .btn-login {
      width: 100%;
      height: 44px;
      font-size: 16px;
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="brand">Cilok <span class="text-primary">Pak Mayoni</span></div>
        <p class="text-body text-muted" style="margin-top: var(--space-1);">Login Admin</p>
      </div>

      <form class="login-form" id="loginForm">
        <div class="login-error" id="loginError"></div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="admin@cilokpakmayoni.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
          Masuk
        </button>
      </form>

      <div class="login-footer">
        <a href="/">&larr; Kembali ke beranda</a>
      </div>
    </div>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
